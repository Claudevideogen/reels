name: Fetch Pixabay clips
on:
  push:
    paths: ['requests/*.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e
          [ -n "$PIXABAY_API_KEY" ] || { echo "Missing PIXABAY_API_KEY secret"; exit 1; }
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          shopt -s nullglob
          for req in requests/*.txt; do
            name=$(basename "$req" .txt)
            if [ -d "clips/$name" ]; then echo "skip $name (in main)"; continue; fi
            mkdir -p "clips/$name"; i=0
            while IFS= read -r q; do
              [ -z "$q" ] && continue; i=$((i+1))
              enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote_plus(sys.argv[1]))" "$q")
              curl -sS "https://pixabay.com/api/videos/?key=$PIXABAY_API_KEY&q=$enc&per_page=20&safesearch=true&video_type=film" -o /tmp/r.json
              python3 - "$i" "$name" <<'PY'
          import json, sys, subprocess
          i, name = sys.argv[1], sys.argv[2]
          hits = json.load(open('/tmp/r.json')).get('hits', [])
          if not hits: print('no results'); sys.exit(0)
          for k, h in enumerate(hits[:4]):
              v = h['videos']['large'] if h['videos']['large']['url'] else h['videos']['medium']
              out = f"clips/{name}/{int(i):02d}{'abcd'[k]}_{h['id']}.mp4"
              subprocess.run(['curl', '-sSL', v['url'], '-o', '/tmp/raw.mp4'], check=True)
              subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', '/tmp/raw.mp4', '-t', '10', '-an',
                              '-vf', "scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(iw,ih),-2,min(1920,ih))'",
                              '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '22', out], check=True)
              open(f"clips/{name}/credits.txt", 'a').write(f"{out}: Pixabay video {h['id']} by {h['user']} ({h['pageURL']})\n")
          PY
            done < "$req"
            # clips go to a throwaway branch (deleted after the reel is rendered) so main stays small
            git checkout -q --orphan "clips-$name"; git rm -rq --cached . ; git add "clips/$name"
            git commit -qm "clips $name"; git push -qf origin "clips-$name"
            git checkout -q -f main; rm -rf "clips/$name"
            mkdir -p requests/done; git mv "$req" "requests/done/$name.txt"
            git commit -qm "Fetched clips: $name (branch clips-$name)"; git push -q origin main
          done
